[project]
name = "learn-nethack"
version = "0.1.0"
description = "Gemma NetHack learning pipeline with Modal training and auditable rollouts."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "pytest>=8",
  "typer>=0.12",
  "rich>=13",
  "wandb>=0.17",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
]
local-nle = [
  "gymnasium>=0.29",
  "nle>=1.3.0",
]
local-world-model = [
  "gymnasium>=0.29",
  "nle>=1.3.0",
  "numpy>=1.26",
  "torch>=2.3",
]
watch = [
  "gymnasium>=0.29",
  "nle>=1.3.0",
  "torch>=2.3",
  "transformers>=4.42",
  "peft>=0.11",
]
modal-train = [
  "modal>=1",
  "torch>=2.3",
  "transformers>=4.42",
  "datasets>=2.20",
  "accelerate>=0.31",
  "peft>=0.11",
  "trl>=0.9",
  "unsloth",
  "gymnasium>=0.29",
  "nle>=1.3.0",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "websockets>=12",
]
modal-vllm = [
  "vllm>=0.5",
]

[project.scripts]
nethack-gemma = "learn_nethack.cli:app"
nethack-world-model = "learn_nethack.local_world_model:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires local NLE data, Modal credentials, network, or GPU state",
]
